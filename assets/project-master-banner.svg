  <text x="162" y="103" fill="#e0f2fe" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="25" font-weight="600" letter-spacing="4">CODEX SKILL</text>
  <text x="76" y="205" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="76" font-weight="750">Project Master <tspan fill="#c4b5fd">2.1</tspan></text>
  <text x="79" y="254" fill="#bfdbfe" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="27">От идеи до проверенного результата — с памятью внутри repository</text>

  <g transform="translate(80 317)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="650">
    <g>
      <rect width="142" height="44" rx="22" fill="#0c4a6e" stroke="#38bdf8" stroke-opacity="0.7"/>
      <text x="71" y="28" text-anchor="middle" fill="#e0f2fe">DISCOVERY</text>
    </g>
    <path d="M153 22h40" stroke="#64748b" stroke-width="2"/><path d="m188 17 7 5-7 5" fill="none" stroke="#64748b" stroke-width="2"/>
    <g transform="translate(204)">
      <rect width="142" height="44" rx="22" fill="#312e81" stroke="#818cf8" stroke-opacity="0.8"/>
      <text x="71" y="28" text-anchor="middle" fill="#e0e7ff">PROCESS</text>
    </g>
    <path d="M357 22h40" stroke="#64748b" stroke-width="2"/><path d="m392 17 7 5-7 5" fill="none" stroke="#64748b" stroke-width="2"/>
    <g transform="translate(408)">
      <rect width="170" height="44" rx="22" fill="#4c1d95" stroke="#a78bfa" stroke-opacity="0.85"/>
      <text x="85" y="28" text-anchor="middle" fill="#ede9fe">ARCHITECTURE</text>
    </g>
    <path d="M589 22h40" stroke="#64748b" stroke-width="2"/><path d="m624 17 7 5-7 5" fill="none" stroke="#64748b" stroke-width="2"/>
    <g transform="translate(640)">

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title description">
  <title id="title">Project Master 2.1</title>
  <desc id="description">Управление сложными проектами для Codex: от идеи до проверенного результата</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#172554"/>
      <stop offset="1" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.52" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1400" height="420" rx="28" fill="url(#background)"/>
  <circle cx="1180" cy="-10" r="250" fill="#7c3aed" opacity="0.2" filter="url(#glow)"/>
  <circle cx="160" cy="390" r="210" fill="#0284c7" opacity="0.18" filter="url(#glow)"/>
  <path d="M0 335 C240 245 410 430 690 332 S1110 245 1400 322 V420 H0Z" fill="#ffffff" opacity="0.025"/>

  <g transform="translate(76 62)">
    <rect width="62" height="62" rx="16" fill="url(#accent)" filter="url(#shadow)"/>
    <path d="M17 43V19h14c8 0 13 4 13 11S39 41 31 41h-6v8" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="47" cy="46" r="5" fill="#fff"/>

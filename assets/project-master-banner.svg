      <text x="71" y="28" text-anchor="middle" fill="#f3e8ff">EXECUTION</text>
    </g>
    <path d="M793 22h40" stroke="#64748b" stroke-width="2"/><path d="m828 17 7 5-7 5" fill="none" stroke="#64748b" stroke-width="2"/>
    <g transform="translate(844)">
